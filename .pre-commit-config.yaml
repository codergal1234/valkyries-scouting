# Git hooks: make setup installs them; make check runs them on every file.
# ruff and mypy run from .venv so they use the versions pinned in requirements.txt.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500", "--enforce-all"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/python -m mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
